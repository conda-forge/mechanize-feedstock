{% set name = "mechanize" %}
{% set version = "0.4.11" %}
{% set sha256 = "544d1e5c97a03f20e726551fea80b5fe46db720491746923e89c9c6960c4b7e8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv


requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - html5lib >=0.999999999

test:
  requires:
    - python {{ python_min }}
  imports:
    - mechanize

about:
  home: https://github.com/python-mechanize/mechanize
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Stateful programmatic web browsing.
  description: |
    Stateful programmatic web browsing in Python. Browse pages programmatically with easy HTML form filling and clicking of links.
  dev_url: https://github.com/python-mechanize/mechanize
  doc_url: https://mechanize.readthedocs.io

extra:
  recipe-maintainers:
    - synapticarbors
